[package]
name = "anotador"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
chrono = "0.4"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# A debug build still has to feel instant when you press the shortcut, and the
# capture path is all bulk memory work. Dependencies do the decoding and
# encoding; `blit` in capture.rs does the compositing, so leaving our own crate
# at opt-level 0 left the hot loop unoptimised. This crate is small enough that
# optimising it costs little rebuild time.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# Speed over size. This app is a few megabytes either way, and the capture path
# is bulk memory work where the optimisation level decided between 133 ms and
# 1 ms in the debug build. Not worth gambling the daily binary to save a little
# disk.
[profile.release]
strip = true
lto = true
opt-level = 3
