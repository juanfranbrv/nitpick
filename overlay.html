<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Select a region</title>
    <link rel="stylesheet" href="/src/overlay.css" />
  </head>
  <body class="overlay">
    <img id="frozen" alt="" draggable="false" />
    <div id="scrim"></div>
    <div id="sel" hidden>
      <div class="sel-size" id="sel-size"></div>
    </div>
    <canvas id="ink" hidden></canvas>
    <div id="crosshair-x"></div>
    <div id="crosshair-y"></div>
    <div id="tip">
      Drag to select ·
      <button type="button" id="btn-full">the whole screen</button>
      · <b>Esc</b> cancels
    </div>

    <form id="composer" hidden>
      <div class="tools">
        <div class="tool-picker" id="tool-picker"></div>
        <div class="swatches" id="swatches"></div>
        <div class="widths" id="widths"></div>
        <button type="button" id="btn-undo" title="Undo stroke (Ctrl+Z)">↶</button>
      </div>
      <textarea id="note-text" rows="3" placeholder="What is wrong here?"></textarea>
      <div class="composer-foot">
        <span><b>Ctrl</b>+<b>Enter</b> to save · <b>Esc</b> to discard</span>
        <button type="submit">Save</button>
      </div>
    </form>

    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
